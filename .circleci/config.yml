version: 2.1

jobs:
  build:
    docker:
      - image: cimg/go:1.23
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-{{ checksum "go.sum" }}
      - run:
          name: Download dependencies
          command: go mod download
      - save_cache:
          key: go-mod-{{ checksum "go.sum" }}
          paths:
            - /go/pkg/mod
      - run:
          name: Build application
          command: go build -o myapp
      - run:
          name: Check for vulnerabilities
          command: |
            go install golang.org/x/vuln/cmd/govulncheck@latest
            govulncheck ./...
      - persist_to_workspace:
          root: .
          paths: myapp
      - store_artifacts:
          path: myapp

  test:
    docker:
      - image: cimg/go:1.23
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-{{ checksum "go.sum" }}
      - run:
          name: Download dependencies
          command: go mod download
      - save_cache:
          key: go-mod-{{ checksum "go.sum" }}
          paths:
            - /go/pkg/mod
      - run:
          name: Run tests
          command: 
            gotestsum --junitfile test_output.xml
      - store_test_results:
          path: test_output.xml

  deploy:
    docker:
      - image: cimg/go:1.23
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:R+RxsogfKi8zGNT3BbfmdbqDvkCOXKYIq+FTwjPlfHE"
      - attach_workspace:
          at: .
      - run:
          name: Confirmation of build application exit 
          command: ls -l .
      - run:
          name: Deploy to EC2 Server
          command: scp -o StrictHostKeyChecking=no ./myapp ${SSH_USER}@${SERVER_IP}:/home/foo/www/myapp
      - run:
          name: Start myapp
          command: ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SERVER_IP} "nohup /home/foo/www/myapp/myapp > myapp.log 2>&1 &"

workflows:
  build-test-and-deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - deploy:
          requires:
            - test
